# Code based on this file: https://github.com/neo4j/neo4j-graphrag-python/blob/main/.github/workflows/pr-e2e-tests.yaml

name: 'Neo4j Parallel Spark Loader Tests'

on:
  pull_request:
    # types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
        neo4j-tag:
          - 'latest'
    services:
      
      neo4j:
        image: neo4j:${{ matrix.neo4j-tag }}
        env:
          NEO4J_AUTH: neo4j/password
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'eval'
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Docker Prune
        run: |
          docker system prune -af
          docker volume prune -f
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Set Python version for Poetry
        run: poetry env use python${{ matrix.python-version }}
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-cache --with dev --all-extras

      - name: Run tests
        shell: bash
        run: make test

  tests-pyspark-4:
    name: v2 tests (PySpark 4.1+, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PYSPARK_PYTHON: python
      PYSPARK_DRIVER_PYTHON: python
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install PySpark 4.1+ test dependencies
        # The Poetry lock targets Spark 3; v2 unit tests need no Neo4j connector.
        run: python -m pip install 'pyspark>=4.1,<5' numpy pytest pytest-mock
      - name: Verify direct partition assignment is available
        run: |
          python - <<'PY'
          import pyspark
          from pyspark.sql import DataFrame

          print(f"Testing PySpark {pyspark.__version__}")
          assert tuple(map(int, pyspark.__version__.split('.')[:2])) >= (4, 1)
          assert callable(getattr(DataFrame, 'repartitionById', None))
          PY
      - name: Run v2 grouping and shipping tests
        run: python -m pytest tests/unit/v2 -v
